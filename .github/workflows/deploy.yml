name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      # The endgame tables in public/db come out of this generator, and
      # the browser reads them with the same rules it was built from.
      - uses: actions/setup-go@v5
        with:
          go-version-file: dbgen/go.mod
          # Nothing to cache: the generator has no dependencies.
          cache: false

      - run: go test ./...
        working-directory: dbgen

      - run: npm run build
        env:
          # GitHub Pages serves this repo from antonmedv.github.io/damka/.
          BASE_PATH: /damka/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
